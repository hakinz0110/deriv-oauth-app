<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS Trade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .phone-mockup {
            width: 100%;
            max-width: 390px;
            height: 844px;
            background: linear-gradient(180deg, #f5f0e8 0%, #f5f0e8 40%, #e8d5f0 70%, #d4c5e8 100%);
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #000;
            z-index: 10;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 24px 20px;
            font-size: 14px;
        }
        .page-indicator { color: #666; font-weight: 500; }
        .skip-btn { color: #d4af37; font-weight: 600; text-decoration: none; }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            text-align: center;
        }
        .logo-container { position: relative; margin-bottom: 60px; }
        .logo-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5f0e8 0%, #fff 50%, #f5f0e8 100%);
            border: 8px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }
        .logo-text-hts {
            font-size: 42px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 2px;
            font-family: Georgia, serif;
        }
        .logo-text-trade {
            font-size: 24px;
            font-weight: 700;
            color: #c9a961;
            letter-spacing: 4px;
            margin-top: -5px;
            font-family: Georgia, serif;
        }
        .badge-rise {
            position: absolute;
            top: -10px;
            right: -30px;
            background: #4caf50;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        .badge-winrate {
            position: absolute;
            bottom: -10px;
            left: -30px;
            color: #7b61ff;
            font-size: 13px;
            font-weight: 600;
        }
        .headline {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 300px;
        }
        .pagination {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        .dot {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: #d0d0d0;
        }
        .dot.active {
            background: #d4af37;
            width: 40px;
        }
        .next-btn {
            width: 100%;
            max-width: 330px;
            padding: 18px;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            border: none;
            border-radius: 25px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s;
        }
        .next-btn:hover { transform: translateY(-2px); }
        .home-indicator {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: #000;
            border-radius: 10px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="phone-mockup">
        <div class="notch"></div>
        <div class="status-bar">
            <div>9:41</div>
            <div>5G 📶 🔋</div>
        </div>
        <div class="top-bar">
            <div class="page-indicator">1/3</div>
            <a href="#" class="skip-btn">Skip</a>
        </div>
        <div class="content">
            <div class="logo-container">
                <div class="logo-circle">
                    <div class="logo-text-hts">HTS</div>
                    <div class="logo-text-trade">TRADE</div>
                </div>
                <div class="badge-rise">Rise · Payout 95%</div>
                <div class="badge-winrate">Win rate 62%</div>
            </div>
            <h1 class="headline">Trade with precision</h1>
            <p class="subtitle">HTS Trade runs your strategies on Deriv around the clock, while you stay in control.</p>
            <div class="pagination">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <a href="/login" class="next-btn">Next</a>
        </div>
        <div class="home-indicator"></div>
    </div>
</body>
</html>
