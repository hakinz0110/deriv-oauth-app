<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS Trade - Onboarding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #F5F0E8 0%, #F5F0E8 30%, #E8D5F0 70%, #D4C5E8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 428px;
            min-height: 100vh;
            background: linear-gradient(180deg, #F5F0E8 0%, #F5F0E8 30%, #E8D5F0 70%, #D4C5E8 100%);
            display: flex;
            flex-direction: column;
            padding: 20px 24px 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 40px;
        }

        .page-indicator {
            font-size: 14px;
            color: #999;
            font-weight: 500;
        }

        .skip-btn {
            color: #D4AF37;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .skip-btn:hover {
            opacity: 0.8;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 80px;
            position: relative;
        }

        .logo-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FDFCFA 0%, #FFFFFF 50%, #F8F6F3 100%);
            border: 8px solid #D4AF37;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25);
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .headline {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .description {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 50px;
            max-width: 320px;
        }

        .description .highlight {
            color: #D4AF37;
            font-weight: 600;
        }

        .pagination {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .dot {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: #D0D0D0;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #D4AF37;
            width: 40px;
        }

        .next-btn {
            width: 100%;
            max-width: 380px;
            padding: 18px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            border: none;
            border-radius: 28px;
            color: #000000;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
        }

        .next-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 428px) {
            .container {
                max-width: 100%;
                padding: 16px 20px 30px;
            }

            .logo-section {
                margin: 40px 0 60px;
            }

            .logo-circle {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="page-indicator">1/3</div>
            <a href="#" class="skip-btn">Skip</a>
        </div>

        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-circle">
                <img src="/img/download.png" alt="HTS TRADE">
            </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
            <h1 class="headline">Trade with precision</h1>
            <p class="description">
                HTS Trade runs your strategies on <span class="highlight">Deriv</span> around the clock, while you stay in control.
            </p>

            <!-- Pagination Dots -->
            <div class="pagination">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- Next Button -->
            <a href="/onboarding2" class="next-btn">Next</a>
        </div>
    </div>
</body>
</html>
