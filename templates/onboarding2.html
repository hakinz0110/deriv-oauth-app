<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS Trade - Choose Strategy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #F5F0E8 0%, #E8D5F0 40%, #C8E6D0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 428px;
            min-height: 100vh;
            background: linear-gradient(180deg, #F5F0E8 0%, #E8D5F0 40%, #C8E6D0 100%);
            display: flex;
            flex-direction: column;
            padding: 20px 24px 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 40px;
        }

        .page-indicator {
            font-size: 14px;
            color: #999;
            font-weight: 500;
        }

        .skip-btn {
            color: #D4AF37;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .skip-btn:hover {
            opacity: 0.8;
        }

        .strategies-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 50px;
        }

        .strategy-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .strategy-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .strategy-name {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
        }

        .strategy-type {
            font-size: 13px;
            color: #7B61FF;
            font-weight: 500;
        }

        .toggle-switch { position: relative; width: 51px; height: 31px; }

        

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #D0D0D0;
            border-radius: 31px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 27px;
            width: 27px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-switch.on .slider {
            background-color: #4CAF50;
        }

        .toggle-switch.on .slider:before {
            transform: translateX(20px);
        }

        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            margin-top: 30px;
        }

        .headline {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .description {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 50px;
            max-width: 320px;
        }

        .pagination {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .dot {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: #D0D0D0;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #D4AF37;
            width: 40px;
        }

        .next-btn {
            width: 100%;
            max-width: 380px;
            padding: 18px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            border: none;
            border-radius: 28px;
            color: #000000;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
        }

        .next-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 428px) {
            .container {
                max-width: 100%;
                padding: 16px 20px 30px;
            }

            .strategies-section {
                margin-bottom: 40px;
            }

            .content-section {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="page-indicator">2/3</div>
            <a href="#" class="skip-btn">Skip</a>
        </div>

        <!-- Strategies Section -->
        <div class="strategies-section">
            <!-- Momentum Rider -->
            <div class="strategy-card">
                <div class="strategy-info">
                    <div class="strategy-name">Momentum Rider</div>
                    <div class="strategy-type">Rise / Fall</div>
                </div>
                <div class="toggle-switch on"><span class="slider"></span></div>
            </div>

            <!-- Digit Edge -->
            <div class="strategy-card">
                <div class="strategy-info">
                    <div class="strategy-name">Digit Edge</div>
                    <div class="strategy-type">Digits</div>
                </div>
                <div class="toggle-switch off"><span class="slider"></span></div>
            </div>

            <!-- Multiplier Guard -->
            <div class="strategy-card">
                <div class="strategy-info">
                    <div class="strategy-name">Multiplier Guard</div>
                    <div class="strategy-type">Multipliers</div>
                </div>
                <div class="toggle-switch on"><span class="slider"></span></div>
            </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
            <h1 class="headline">Choose your strategy</h1>
            <p class="description">
                Pick a contract type, set your risk, and switch strategies on or off in one tap.
            </p>

            <!-- Pagination Dots -->
            <div class="pagination">
                <div class="dot"></div>
                <div class="dot active"></div>
                <div class="dot"></div>
            </div>

            <!-- Next Button -->
            <a href="/onboarding3" class="next-btn">Next</a>
        </div>
    </div>
</body>
</html>
