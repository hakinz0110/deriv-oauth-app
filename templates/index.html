<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Trading Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0e0e0e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 375px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: #ff9800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .skip-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
        }

        .skip-btn:hover {
            color: #fff;
        }

        .market-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .market-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path d="M50,100 L70,80 L90,95 L110,70 L130,85 L150,60" stroke="%23333" stroke-width="2" fill="none" opacity="0.3"/></svg>');
            opacity: 0.5;
        }

        .market-pulse {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .balance-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .balance-change {
            font-size: 14px;
            color: #4caf50;
            margin-bottom: 20px;
        }

        .balance-change.negative {
            color: #f44336;
        }

        .market-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .stat-change {
            font-size: 11px;
            color: #4caf50;
        }

        .stat-change.negative {
            color: #f44336;
        }

        .welcome-section {
            text-align: left;
            margin-bottom: 40px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #888;
            line-height: 1.5;
        }

        .pagination-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .dot {
            width: 32px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .dot.active {
            background: #ff9800;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: #ff9800;
            color: #000;
        }

        .btn-primary:hover {
            background: #ffab00;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
        }

        .btn-secondary:hover {
            border-color: #ff9800;
            color: #ff9800;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #ff9800;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #f44336;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .account-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .account-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .account-label {
            font-size: 12px;
            color: #888;
        }

        .account-value {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🎯</div>
                <span>DERIV BOT</span>
            </div>
            <button class="skip-btn" onclick="window.location.href='/logout'">Logout</button>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your account data...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = window.location.origin;

        // State
        let accountData = null;
        let isAuthenticated = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndLoadData();
        });

        async function checkAuthAndLoadData() {
            try {
                // Check authentication status
                const authResponse = await fetch(`${API_BASE_URL}/`);
                const authData = await authResponse.json();

                isAuthenticated = authData.status === 'authenticated';

                if (!isAuthenticated) {
                    showUnauthenticatedView();
                    return;
                }

                // Load account data
                const accountsResponse = await fetch(`${API_BASE_URL}/accounts`);
                
                if (!accountsResponse.ok) {
                    throw new Error('Failed to fetch accounts');
                }

                accountData = await accountsResponse.json();
                showAuthenticatedView();

            } catch (error) {
                console.error('Error loading data:', error);
                showErrorView(error.message);
            }
        }

        function showUnauthenticatedView() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="market-card">
                    <div class="market-pulse">
                        <div class="pulse-dot"></div>
                        <span>MARKET PULSE</span>
                    </div>
                    <div class="balance-label">Demo Balance Available</div>
                    <div class="balance-amount">$10,000</div>
                    <div class="balance-change">Start trading today</div>
                    <div class="market-stats">
                        <div class="stat">
                            <div class="stat-label">Markets</div>
                            <div class="stat-value">150+</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Instruments</div>
                            <div class="stat-value">50+</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Active</div>
                            <div class="stat-value">24/7</div>
                        </div>
                    </div>
                </div>

                <div class="welcome-section">
                    <h1 class="welcome-title">Welcome to Deriv Trading Bot</h1>
                    <p class="welcome-subtitle">Precision trading, clear markets, and a calmer way to manage your portfolio.</p>
                </div>

                <div class="pagination-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <div class="action-buttons">
                    <a href="${API_BASE_URL}/login" class="btn btn-primary">
                        Begin your journey
                        <span>→</span>
                    </a>
                    <div style="text-align: center; margin-top: 8px;">
                        <span style="color: #888; font-size: 14px;">New to Deriv? </span>
                        <a href="${API_BASE_URL}/signup" style="color: #ff9800; text-decoration: none; font-weight: 600;">Sign up</a>
                    </div>
                </div>
            `;
        }

        function showAuthenticatedView() {
            const content = document.getElementById('content');
            
            // Calculate totals
            const accounts = accountData.accounts || [];
            const totalBalance = accounts.reduce((sum, acc) => sum + parseFloat(acc.balance || 0), 0);
            const demoAccount = accounts.find(acc => acc.account_type === 'demo');
            const realAccount = accounts.find(acc => acc.account_type === 'real');
            const activeAccounts = accounts.filter(acc => acc.status === 'active').length;

            content.innerHTML = `
                <div class="market-card">
                    <div class="market-pulse">
                        <div class="pulse-dot"></div>
                        <span>LIVE ACCOUNT</span>
                    </div>
                    <div class="balance-label">Total Balance</div>
                    <div class="balance-amount">$${totalBalance.toFixed(2)}</div>
                    <div class="balance-change">
                        ${accounts.length} account${accounts.length !== 1 ? 's' : ''} connected
                    </div>
                    <div class="market-stats">
                        <div class="stat">
                            <div class="stat-label">Demo</div>
                            <div class="stat-value">${demoAccount ? '$' + parseFloat(demoAccount.balance).toFixed(2) : 'N/A'}</div>
                            <div class="stat-change">${demoAccount ? demoAccount.currency : ''}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Real</div>
                            <div class="stat-value">${realAccount ? '$' + parseFloat(realAccount.balance).toFixed(2) : 'N/A'}</div>
                            <div class="stat-change">${realAccount ? realAccount.currency : ''}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Active</div>
                            <div class="stat-value">${activeAccounts}</div>
                            <div class="stat-change">accounts</div>
                        </div>
                    </div>
                </div>

                <div class="welcome-section">
                    <h1 class="welcome-title">Welcome Back!</h1>
                    <p class="welcome-subtitle">Your accounts are ready. Select an account to start trading.</p>
                </div>

                <div class="account-info">
                    <div class="account-row">
                        <span class="account-label">Status</span>
                        <span class="status-badge">Connected</span>
                    </div>
                    <div class="account-row">
                        <span class="account-label">Total Accounts</span>
                        <span class="account-value">${accounts.length}</span>
                    </div>
                    <div class="account-row">
                        <span class="account-label">Selected Account</span>
                        <span class="account-value">${accountData.selected_account ? accountData.selected_account.account_id : 'None'}</span>
                    </div>
                </div>

                <div class="pagination-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <div class="action-buttons">
                    <a href="${API_BASE_URL}/accounts" class="btn btn-primary">
                        View All Accounts
                        <span>→</span>
                    </a>
                    <a href="${API_BASE_URL}/market-data/url" class="btn btn-secondary">
                        Market Data
                    </a>
                </div>
            `;
        }

        function showErrorView(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error">
                    ⚠️ Error: ${message}
                </div>
                <div class="welcome-section">
                    <h1 class="welcome-title">Something went wrong</h1>
                    <p class="welcome-subtitle">We couldn't load your account data. Please try again.</p>
                </div>
                <div class="action-buttons">
                    <button onclick="location.reload()" class="btn btn-primary">
                        Try Again
                        <span>↻</span>
                    </button>
                    <a href="${API_BASE_URL}/login" class="btn btn-secondary">
                        Login Again
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
