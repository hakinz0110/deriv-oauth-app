<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS Trade - Protected Limits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #E8D5F0 0%, #F5F0E8 50%, #C8E6D0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 428px;
            min-height: 100vh;
            background: linear-gradient(180deg, #E8D5F0 0%, #F5F0E8 50%, #C8E6D0 100%);
            display: flex;
            flex-direction: column;
            padding: 20px 24px 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 40px;
        }

        .page-indicator {
            font-size: 14px;
            color: #999;
            font-weight: 500;
        }

        .icon-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px 0 30px;
        }

        .icon-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F8F8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        .shield-icon {
            width: 70px;
            height: 70px;
        }

        .shield-icon svg {
            width: 100%;
            height: 100%;
        }

        .limits-section {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .limit-label {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.7);
        }

        .stop-loss {
            color: #E74C3C;
        }

        .daily-limit {
            color: #2C3E50;
        }

        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            margin-top: 20px;
        }

        .headline {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .description {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 50px;
            max-width: 320px;
        }

        .pagination {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .dot {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: #D0D0D0;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #D4AF37;
            width: 40px;
        }

        .get-started-btn {
            width: 100%;
            max-width: 380px;
            padding: 18px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            border: none;
            border-radius: 28px;
            color: #000000;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .get-started-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
        }

        .get-started-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 428px) {
            .container {
                max-width: 100%;
                padding: 16px 20px 30px;
            }

            .icon-section {
                margin: 30px 0 20px;
            }

            .icon-circle {
                width: 140px;
                height: 140px;
            }

            .shield-icon {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="page-indicator">3/3</div>
        </div>

        <!-- Icon Section -->
        <div class="icon-section">
            <div class="icon-circle">
                <div class="shield-icon">
                    <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M35 5L10 15V32.5C10 47.5 19.5 61.5 35 65C50.5 61.5 60 47.5 60 32.5V15L35 5Z" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M25 35L31 41L45 27" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- Limits Labels -->
            <div class="limits-section">
                <div class="limit-label stop-loss">Stop-loss $50.00</div>
                <div class="limit-label daily-limit">Daily limit $100.00</div>
            </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
            <h1 class="headline">Protected by your limits</h1>
            <p class="description">
                Stop-loss and daily loss limits guard your balance. Connect your Deriv account to begin.
            </p>

            <!-- Pagination Dots -->
            <div class="pagination">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot active"></div>
            </div>

            <!-- Get Started Button -->
            <a href="/login?direct=1" class="get-started-btn">Get Started</a>
        </div>
    </div>
</body>
</html>
