[phases.setup]
nixPkgs = ['python312', 'pip']

[phases.install]
cmds = ['python -m pip install --upgrade pip', 'python -m pip install -r requirements.txt']

[phases.build]
cmds = ['echo "Build phase - forcing cache bust"']

[start]
cmd = 'gunicorn --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY --timeout $TIMEOUT wsgi:app'
