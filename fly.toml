# Fly.io configuration file
# Learn more: https://fly.io/docs/reference/configuration/

app = "deriv-oauth-app"
primary_region = "iad"

[build]

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  PORT = "10000"
